
server:
  applicationContextPath: /
  adminContextPath: /
  applicationConnectors:
    - type: http
      port: 20375
  adminConnectors:
    - type: http
      port: 20376

#
# See https://www.dropwizard.io/en/latest/manual/configuration.html#logging
#
logging:
  level: INFO
  appenders:
    - type: console
      logFormat: "%-5p [%d{ISO8601}] [%t] %c: %m%n%rEx"

    - type: file
      archive: false
      currentLogFilename: data/dd-validate-bagpack.log
  loggers:
    'nl.knaw.dans': DEBUG
    'org.hibernate.engine.internal.StatisticalLoggingSessionEventListener': 'OFF'

validation:
  dataCiteSchema: "../dans-schema/lib/src/main/resources/extern/datacite/v4.4/metadata.xsd"


server:
  applicationContextPath: /
  adminContextPath: /
  applicationConnectors:
    - type: http
      port: 20375
  adminConnectors:
    - type: http
      port: 20376

#
# See https://www.dropwizard.io/en/latest/manual/configuration.html#logging
#
logging:
  level: INFO
  appenders:
    - type: console
      logFormat: "%-5p %c{0}: %m%n%dwREx"

    - type: file
      archive: false
      currentLogFilename: data/dd-validate-bagpack.log
  loggers:
    'nl.knaw.dans': DEBUG
    'org.hibernate.engine.internal.StatisticalLoggingSessionEventListener': 'OFF'

validation:
  baseUrl: "http://localhost:20375/validate"
  baseFolder: "../dd-transfer-to-vault/"
  dataCiteSchema: "file:./src/main/assembly/dist/cfg/datacite/v4.4/metadata.xsd"
  dansBagPackBagItProfile: "https://doi.org/10.17026/E948-0R32"
  sparqlQueries:
    findBagId: "src/main/assembly/dist/cfg/find-bagId.sparql"
    findAggregatedResourceProps: "src/main/assembly/dist/cfg/find-aggregated-resource-props.sparql"
    findAggregatedResourceIds: "src/main/assembly/dist/cfg/find-aggregated-resource-ids.sparql"
  holeyBags:
    # Turn on support for holey bags; if false holey bags are considered invalid
    allow: false
    # Specify headers to be added to the requests to the remote servers. The keys are base URLs. This can be used to fetch files that require authentication or custom headers.
    addHeaders: { }
    # 'https://mydataverse.example.com':
    #     X-Dataverse-key: <your-api-token>

    # When calculating the hash of fetched files, use chunks of this size.
    chunkSize: 128Mb
    # Maximum times to try and hash a chunk
    maxRetries: 30
    # Sleep between retries
    retrySleep: 10 seconds
    # Maximum number of redirects to follow
    maxRedirects: 20
    # Whether to fall back to full stream if range request fails
    fallBackToFullStreamOnRangeFail: true
  taskQueue:
    nameFormat: "validation-worker-%d"
    maxQueueSize: 5000
    # Number of threads will be increased when maxQueueSize is exceeded.
    minThreads: 1
    # No more than maxThreads will be created though
    maxThreads: 3
    # Threads will die after 60 seconds of idleness
    keepAliveTime: 60 seconds
  taskRetentionTime: 1 day
  maxNumberOfTasks: 1000

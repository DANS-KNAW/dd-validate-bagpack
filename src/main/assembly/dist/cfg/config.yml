#
# dd-validate-bagpack configuration file
#
server:
  applicationContextPath: /
  adminContextPath: /
  applicationConnectors:
    - type: http
      port: 20375
  adminConnectors:
    - type: http
      port: 20376
  # Logs the requests to the Jetty http server
  requestLog:
    appenders:
      - type: file
        archive: false
        timeZone: system
        currentLogFilename: /var/opt/dans.knaw.nl/log/dd-validate-bagpack/request.log

validation:
  # The base folder under which the bags to be validated must be placed.
  baseFolder: "/var/opt/dans.knaw.nl/tmp"
  baseUrl: "http://localhost:20376/validate"
  dataCiteSchema: "file:///etc/opt/dans.knaw.nl/dd-validate-bagpack/datacite/v4.4/metadata.xsd"
  dansBagPackBagItProfile: "https://doi.org/10.17026/E948-0R32"
  sparqlQueries:
    findBagId: "/etc/opt/dans.knaw.nl/dd-validate-bagpack/find-bagId.sparql"
    findAggregatedResourceProps: "/etc/opt/dans.knaw.nl/dd-validate-bagpack/find-aggregated-resource-props.sparql"
    findAggregatedResourceIds: "/etc/opt/dans.knaw.nl/dd-validate-bagpack/find-aggregated-resource-ids.sparql"

  taskQueue:
    nameFormat: "validation-worker-%d"
    maxQueueSize: 5000
    # Number of threads will be increased when maxQueueSize is exceeded.
    minThreads: 1
    # No more than maxThreads will be created though
    maxThreads: 3
    # Threads will die after 60 seconds of idleness
    keepAliveTime: 60 seconds
  # Keep tasks in memory for 1 day. This should be long enough to allow for the client to retrieve the results.
  taskRetentionTime: 1 day
  # Maximum number of tasks to keep in memory.
  maxNumberOfTasks: 1000

#
# See https://www.dropwizard.io/en/latest/manual/configuration.html#logging
#
logging:
  level: INFO
  appenders:
    - type: file
      archive: false
      timeZone: system
      currentLogFilename: /var/opt/dans.knaw.nl/log/dd-validate-bagpack/dd-validate-bagpack.log
    - type: console
      # Used in combination with journald, which already adds the timestamp
      logFormat: "%-5p %c{0}: %m%n%dwREx"
  loggers:
    'org.hibernate.engine.internal.StatisticalLoggingSessionEventListener': 'OFF'
